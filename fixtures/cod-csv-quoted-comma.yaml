schema: hahahah.coding.fixture/v1
id: cod-csv-quoted-comma
language: id
tags: [csv, quoting, parsing]
brief: >-
  splitFields(line) memecah satu baris CSV. Kolom yang diapit tanda kutip ganda
  boleh mengandung koma dan kutipannya sendiri dibuang. Sekarang koma di dalam
  kutipan ikut dianggap pemisah jadi kolomnya pecah.
files:
  - path: src/fields.js
    content: |
      export function splitFields(line) {
        return line.split(',');
      }
  - path: test/fields.test.js
    content: |
      import test from 'node:test';
      import assert from 'node:assert/strict';
      import { splitFields } from '../src/fields.js';

      test('koma di dalam kutipan bukan pemisah', () => {
        assert.deepEqual(splitFields('"Kopi, susu",25000'), ['Kopi, susu', '25000']);
      });

      test('baris tanpa kutipan tetap utuh', () => {
        assert.deepEqual(splitFields('buku,12000,pulpen,4000'), ['buku', '12000', 'pulpen', '4000']);
      });

      test('satu kolom terkutip menghasilkan satu field', () => {
        assert.deepEqual(splitFields('"Satu kata"'), ['Satu kata']);
      });
solution:
  - path: src/fields.js
    content: |
      export function splitFields(line) {
        const fields = [];
        let current = '';
        let quoted = false;
        for (const char of line) {
          if (char === '"') {
            quoted = !quoted;
            continue;
          }
          if (char === ',' && !quoted) {
            fields.push(current);
            current = '';
            continue;
          }
          current += char;
        }
        fields.push(current);
        return fields;
      }
tests: 3
