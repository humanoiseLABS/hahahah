schema: hahahah.coding.fixture/v1
id: cod-mask-secret
language: id
tags: [secrets, logging]
brief: >-
  maskSecret(value) buat log: 3 karakter pertama dan 2 terakhir boleh kelihatan, sisanya
  diganti bintang dengan panjang total sama. Nilai pendek (6 karakter atau kurang) harus
  jadi bintang semua.
files:
  - path: src/mask.js
    content: |
      export function maskSecret(value) {
        return '****' + value.slice(-4);
      }
  - path: test/mask.test.js
    content: |
      import test from 'node:test';
      import assert from 'node:assert/strict';
      import { maskSecret } from '../src/mask.js';

      test('tepi kelihatan, tengah dibintang, panjang utuh', () => {
        assert.equal(maskSecret('abcdef123456'), 'abc*******56');
      });

      test('nilai pendek ditutup total', () => {
        assert.equal(maskSecret('short'), '*****');
      });

      test('string kosong tetap kosong', () => {
        assert.equal(maskSecret(''), '');
      });
solution:
  - path: src/mask.js
    content: |
      export function maskSecret(value) {
        if (value.length <= 6) {
          return '*'.repeat(value.length);
        }
        const head = value.slice(0, 3);
        const tail = value.slice(-2);
        return head + '*'.repeat(value.length - 5) + tail;
      }
tests: 3
