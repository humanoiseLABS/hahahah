schema: hahahah.coding.fixture/v1
id: cod-page-offset-one-based
language: en
tags: [pagination, off-by-one]
brief: >-
  offsetFor(page, limit) converts a 1-based page number into a SQL OFFSET.
  Page 1 must start at row 0, and asking for page 0 is a bug in the caller,
  not something that should silently return row zero.
files:
  - path: src/paging.js
    content: |
      export function offsetFor(page, limit) {
        return page * limit;
      }
  - path: test/paging.test.js
    content: |
      import test from 'node:test';
      import assert from 'node:assert/strict';
      import { offsetFor } from '../src/paging.js';

      test('the first page starts at row zero', () => {
        assert.equal(offsetFor(1, 10), 0);
      });

      test('the third page skips two pages', () => {
        assert.equal(offsetFor(3, 10), 20);
      });

      test('page zero is rejected', () => {
        assert.throws(() => offsetFor(0, 10), /1-based/);
      });
solution:
  - path: src/paging.js
    content: |
      export function offsetFor(page, limit) {
        if (!Number.isInteger(page) || page < 1) {
          throw new Error('page is 1-based');
        }
        return (page - 1) * limit;
      }
tests: 3
