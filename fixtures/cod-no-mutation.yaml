schema: hahahah.coding.fixture/v1
id: cod-no-mutation
language: id
tags: [purity, arrays]
brief: >-
  normalizeIds(ids) harus ngasih array baru yang sudah diurutkan dan di-lowercase.
  Array milik pemanggil nggak boleh berubah urutannya.
files:
  - path: src/ids.js
    content: |
      export function normalizeIds(ids) {
        return ids.sort((a, b) => a.localeCompare(b)).map((id) => id.trim().toLowerCase());
      }
  - path: test/ids.test.js
    content: |
      import test from 'node:test';
      import assert from 'node:assert/strict';
      import { normalizeIds } from '../src/ids.js';

      test('hasilnya terurut dan lowercase', () => {
        assert.deepEqual(normalizeIds([' Beta ', 'alpha']), ['alpha', 'beta']);
      });

      test('array pemanggil tidak ikut berubah', () => {
        const input = ['zulu', 'alpha'];
        normalizeIds(input);
        assert.deepEqual(input, ['zulu', 'alpha']);
      });
solution:
  - path: src/ids.js
    content: |
      export function normalizeIds(ids) {
        return [...ids]
          .map((id) => id.trim().toLowerCase())
          .sort((a, b) => a.localeCompare(b));
      }
tests: 2
