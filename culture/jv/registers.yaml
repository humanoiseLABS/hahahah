version: '2026.11'
reviewed_by: pending
next_review: '2027-02-01'
levels:
  ngoko:
    use: intimate peers, younger people, established ngoko relationships
    pronouns:
      i: aku
      you: kowe
    markers:
      no: ora
      will: arep
      eat: mangan
  madya:
    use: neutral strangers and status-unclear situations
    pronouns:
      i: kula
      you: sampeyan
    markers:
      no: mboten
      will: badhe
      eat: dhahar
  krama:
    use: polite/upward; elders, teachers, officials, formal contexts
    pronouns:
      i: kula
      you: panjenengan
    markers:
      no: mboten
      will: badhe
      eat: dhahar
honorifics:
  krama_inggil: honorific vocabulary for the addressee/actions; not a fourth full level
  krama_andhap: humble vocabulary for the speaker; not a fourth full level
defaults:
  close_peer_or_younger: ngoko
  unknown_or_status_unclear: madya or krama
  elder_teacher_official: krama, with krama_inggil where appropriate
  genuinely_unclear: ask one targeted question
common_errors:
  - using ngoko upward
  - mixing levels in one utterance
  - overusing panjenengan with close peers
  - treating sampeyan as top-polite
  - using krama_inggil for oneself
  - assuming Jogja krama is safe in Banyumasan
banyumasan:
  preferred_name: Banyumasan
  note: 'Ngapak may be used by speakers but is also a mocking label. Banyumasan krama is shallower and differs from Surakarta-Yogyakarta; do not default to Jogja krama inggil.'
sources:
