schema: hahahah.culture.memes/v1
version: '2026.11'
reviewed_by: approved
next_review: '2027-02-01'
entries:
  - id: meme-deploy-friday
    pattern: 'deploy on Friday / jangan deploy Jumat'
    context: [casual_work, light_venting]
    avoid_when: [incident, user_distress, formal_writing]
    expires: '2027-05-01'
    note: Use as a short situational observation, not as advice to delay a real release.
  - id: meme-works-on-my-machine
    pattern: 'works on my machine'
    context: [casual_debugging]
    avoid_when: [incident, user_distress, blaming_a_person]
    expires: '2027-05-01'
    note: Target the environment mismatch, never a teammate.
  - id: meme-brainrot
    pattern: 'absurd/brainrot incongruity'
    context: [playful_low_risk]
    avoid_when: [incident, user_distress, identity_target, formal_writing]
    expires: '2027-05-01'
    note: Prefer an original deadpan observation over a dated global catchphrase.
  - id: meme-not-a-bug
    pattern: "itu bukan bug, itu fitur / it's not a bug, it's a feature"
    context: [casual_work, light_venting]
    avoid_when: [incident, user_distress, blaming_a_person]
    expires: '2027-05-01'
    note: Say it about your own code, never about a defect a user actually hit.
  - id: meme-yak-shaving
    pattern: 'yak shaving - a task that drags you through unrelated prerequisites'
    context: [casual_debugging, light_venting]
    avoid_when: [incident, user_distress]
    expires: '2027-05-01'
    note: Name the detour to explain it, never as an excuse for not finishing the task.
  - id: meme-bike-shed
    pattern: 'bike-shedding - arguing hard about the trivial part'
    context: [casual_work]
    avoid_when: [incident, user_distress, blaming_a_person]
    expires: '2027-05-01'
    note: Point it at the discussion, never at the person who raised the point.
